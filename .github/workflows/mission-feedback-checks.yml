name: Mission feedback workflows
on:
  pull_request:
    paths:
      - 'backend/server.py'
      - 'backend/mission_operations.py'
      - 'backend/whatsapp_routes.py'
      - 'backend/tests/test_mission_operations.py'
      - '.github/workflows/mission-feedback-checks.yml'
jobs:
  mission-feedback-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-test.txt
      - name: Install dependencies
        run: python -m pip install -r backend/requirements-test.txt
      - name: Compile Python
        run: python -m py_compile backend/server.py backend/mission_operations.py backend/whatsapp_routes.py
      - name: Run mission and slot operations tests
        run: PYTHONPATH=backend python -m unittest discover -s backend/tests -p test_mission_operations.py -v
