name: Activation diagnostics checks

on:
  pull_request:
    paths:
      - "backend/activation_diagnostics.py"
      - "backend/tests/test_activation_diagnostics.py"
      - ".github/workflows/activation-diagnostics.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pydantic
        run: python -m pip install 'pydantic>=2,<3'
      - name: Validate module syntax
        run: python -m py_compile backend/activation_diagnostics.py
      - name: Run isolated backend tests
        run: PYTHONPATH=backend python -m unittest discover -s backend/tests -p test_activation_diagnostics.py
