name: ShiftFlow checks
on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/shiftflow-checks.yml'
  workflow_dispatch:

jobs:
  timesheets-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r backend/requirements-test.txt
      - run: python -m unittest discover -s backend/tests -p 'test_timesheets.py'

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: corepack enable
      - run: yarn install --frozen-lockfile
        working-directory: frontend
      - run: CI=true yarn test --watch=false --runInBand
        working-directory: frontend
      - run: CI=true yarn build
        working-directory: frontend
